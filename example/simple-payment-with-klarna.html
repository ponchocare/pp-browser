<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basket - Order #67651</title>
    <script type="module" src="/dist/index.js"></script>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f8f9fa;
        margin: 0;
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .basket {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        width: 360px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
      }

      .basket h2 {
        margin-top: 0;
        font-size: 1.5rem;
        border-bottom: 2px solid #eee;
        padding-bottom: 0.5rem;
      }

      .order-number {
        font-size: 0.95rem;
        color: #888;
        margin-bottom: 1rem;
      }

      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 1rem 0;
      }

      .item-name {
        font-weight: 500;
      }

      .item-price {
        color: #666;
      }

      .total {
        border-top: 2px solid #eee;
        margin-top: 1rem;
        margin-bottom: 1rem;
        padding-top: 1rem;
        display: flex;
        justify-content: space-between;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="basket">
      <h2>Your Basket</h2>
      <div class="order-number">Order #11651</div>

      <div class="item">
        <span class="item-name">A pen</span>
        <span class="item-price">£2.00</span>
      </div>
      <div class="item">
        <span class="item-name">Arts & Crafts</span>
        <span class="item-price">£0.40</span>
      </div>
      <div class="total">
        <span>Total</span>
        <span>£2.40</span>
      </div>
      <pp-payment
        base="https://demo.ponchopay.com/"
        amount="240"
        metadata="order:11651"
        urn="🏠"
        token="🤫"
        note="Example payment"
        email="tommy@server.com"
        line_items='[
          {
              "quantity": 1,
              "amount": 200,
              "description": "A pen"
          },
          {
              "quantity": 1,
              "amount": 40,
              "description": "Arts & Crafts"
          }
      ]'
      ></pp-payment>
    </div>
  </body>
</html>
